---
- name: Insert fish shell at the top of the shell list
  become: true
  ansible.builtin.lineinfile:
    path: /etc/shells
    line: '/opt/homebrew/bin/fish'
    insertbefore: '^/bin/bash'
    backup: true

- name: Change default shell to fish for the current user
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    shell: /opt/homebrew/bin/fish
    generate_ssh_key: true
    ssh_key_type: ed25519
    update_password: on_create
    ssh_key_file: .ssh/id_ed25519

- name: Copy sudo local template for sudo Touch ID
  become: true
  ansible.builtin.copy:
    src: /etc/pam.d/sudo_local.template
    dest: /etc/pam.d/sudo_local
    mode: preserve

- name: Enable sudo with Touch ID
  become: true
  ansible.builtin.lineinfile:
    path: /etc/pam.d/sudo_local.template
    regexp: '^#\s*(auth\s+sufficient\s+pam_tid\.so)$'
    line: 'auth       sufficient     pam_tid.so'
    backrefs: true
    backup: true

- name: Run general commands
  become: true
  loop: "{{ general_commands }}"
  loop_control:
    loop_var: general_commands_loop
    label: "{{ general_commands_loop }}"
  ansible.builtin.command: "{{ general_commands_loop }}"

